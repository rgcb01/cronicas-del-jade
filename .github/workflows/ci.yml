name: Verify prototype

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic combat tests
        run: npm test
      - name: Regenerate standalone HTML
        run: npm run build
      - name: Check bundled HTML is up to date
        run: git diff --exit-code -- index.html
